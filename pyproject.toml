[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-timeline-kit"
version = "0.1.0"
description = "Offline short-video scene timeline and subtitle generator"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
reel-timeline = "reel_timeline_kit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
